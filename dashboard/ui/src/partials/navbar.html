<!-- ═══════════════════════════ NAVBAR ═══════════════════════════ -->
<nav class="flex-none h-11 bg-slate-900/60 backdrop-blur-xl border-b border-slate-700/30 px-4 flex items-center justify-between z-20 shadow-md">
  <div class="flex items-center gap-3">
    <button @click="sidebarOpen = !sidebarOpen" class="lg:hidden mr-1 p-1 rounded hover:bg-slate-700 text-slate-400 hover:text-white transition-colors cursor-pointer" aria-label="Menu">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <img src="/ui/logo-192.png?v=2" alt="Logo" class="w-9 h-9 object-contain drop-shadow-[0_0_8px_rgba(10,132,255,0.6)]" />
    <span class="font-bold text-blue-400 tracking-tight text-base">Rooster</span>
    <span class="text-slate-500 text-xs hidden sm:inline">Dashboard</span>
    <span class="hidden lg:inline text-slate-700 text-xs" x-text="'v' + (appVersion || '...')"></span>
  </div>

  <div class="flex items-center gap-5">
    <!-- Proxy Popover -->
    <div class="hidden md:block relative mr-2 pr-4 border-r border-slate-700/50" x-data="{ proxyOpen: false }" @click.outside="proxyOpen = false">
      <button @click="proxyOpen = !proxyOpen" 
              class="flex items-center gap-2 px-2.5 py-1.5 rounded-md transition-all duration-200 border cursor-pointer group outline-none"
              :class="proxyEnabled ? 'bg-green-950/30 border-green-700/50 hover:bg-green-900/40 hover:border-green-600/60' : 'bg-slate-800/50 border-slate-700/50 hover:bg-slate-700 hover:border-slate-600'">
        <span class="text-xs font-bold transition-colors uppercase tracking-wide" :class="proxyEnabled ? 'text-green-400' : 'text-slate-400 group-hover:text-slate-300'" x-text="t('proxy_label') || '🌐 PROXY'"></span>
        <span class="w-1.5 h-1.5 rounded-full shadow-sm transition-colors" :class="proxyEnabled ? 'bg-green-500 shadow-green-500/50 animate-pulse' : 'bg-slate-600'"></span>
      </button>

      <div x-show="proxyOpen" x-cloak
           x-transition:enter="transition ease-out duration-200"
           x-transition:enter-start="opacity-0 translate-y-2 scale-95"
           x-transition:enter-end="opacity-100 translate-y-0 scale-100"
           x-transition:leave="transition ease-in duration-150"
           x-transition:leave-start="opacity-100 translate-y-0 scale-100"
           x-transition:leave-end="opacity-0 translate-y-2 scale-95"
           class="absolute top-full right-4 mt-2 w-64 bg-slate-800/95 backdrop-blur-xl border border-slate-700 rounded-xl shadow-2xl p-4 z-50 origin-top-right">
           
           <div class="flex items-center justify-between mb-3">
             <span class="text-xs font-bold text-slate-200" x-text="t('proxy_label') || '🌐 Proxy'"></span>
             <button @click="toggleProxy()" 
                     class="relative inline-flex h-5 w-9 items-center rounded-full transition-colors focus:outline-none shadow-inner"
                     :class="proxyEnabled ? 'bg-green-500' : 'bg-slate-700'">
               <span class="inline-block h-3 w-3 transform rounded-full bg-white transition-transform shadow-md"
                     :class="proxyEnabled ? 'translate-x-5' : 'translate-x-1'"></span>
             </button>
           </div>
           
           <div class="space-y-1.5">
             <label class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider">Proxy URL</label>
             <input type="text" x-model="proxyUrl" @change="updateProxyUrl()"
                    class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/50 transition-all font-mono placeholder-slate-600" 
                    placeholder="http://127.0.0.1:7890" />
           </div>
      </div>
    </div>

    <!-- Abbreviated indicators (mobile only) -->
    <div class="flex items-center gap-1.5 text-xs md:hidden">
      <span class="w-2 h-2 rounded-full" :class="wsConnected ? 'bg-green-400' : 'bg-red-500 pulse'"></span>
      <span class="w-2 h-2 rounded-full" :class="gatewayConnected ? 'bg-blue-400' : 'bg-slate-600'"></span>
    </div>
    <!-- Full indicators (tablet+) -->
    <div class="hidden md:flex items-center gap-5">
      <div class="flex items-center gap-1.5 text-xs">
        <span class="w-2 h-2 rounded-full flex-shrink-0" :class="wsConnected ? 'bg-green-400 shadow shadow-green-500/50' : 'bg-red-500 pulse'"></span>
        <span :class="wsConnected ? 'text-green-400' : 'text-red-400'" x-text="t('dashboard_status') + (wsConnected ? ' ●' : ' ○')"></span>
      </div>
      <div class="flex items-center gap-1.5 text-xs">
        <span class="w-2 h-2 rounded-full flex-shrink-0" :class="gatewayConnected ? 'bg-blue-400' : 'bg-slate-600'"></span>
        <span :class="gatewayConnected ? 'text-blue-400' : 'text-slate-500'" x-text="t('gateway_status') + (gatewayConnected ? ' ●' : ' ○')"></span>
      </div>
    </div>
    <span class="text-xs text-slate-500 bg-slate-700/60 px-2 py-0.5 rounded border border-slate-600 hidden sm:inline"
          x-text="'# ' + sessionId.slice(-8)"></span>
  </div>
</nav>
